---
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.0.2
    container_name: uptimekuma-prod
    networks:
      - reverse-proxy
    labels:
      # Explicitly allow Traefik to see and expose this container
      - traefik.enable=true
      - traefik.docker.network=reverse-proxy
      # HTTPS router configuration
      - traefik.http.routers.uptimekuma-https.entrypoints=websecure
      - traefik.http.routers.uptimekuma-https.rule=Host(`uptimekuma.docker-prod.routessh.com`)
      - traefik.http.routers.uptimekuma-https.tls=true
      - traefik.http.routers.uptimekuma-https.tls.certresolver=cloudflare

    volumes:
      - ./data:/app/data
    restart: unless-stopped

networks:
  reverse-proxy:
    external: true
    name: reverse-proxy